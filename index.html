<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandis RP | Nagasaki Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Фоновое изображение в полную силу */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
           background-image: url('nagasaki.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Легкое затемнение для читаемости текста (по желанию, можешь убрать) */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Полупрозрачный черный слой */
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 60px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        /* Навигация */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 80px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .nav-links {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .nav-links a:hover {
            color: #ff4d6d;
        }

        .nav-right {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        /* Переключатель языков */
        .language-selector {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .lang-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: #ff4d6d;
        }

        .lang-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin-top: 5px;
            min-width: 120px;
            z-index: 100;
        }

        .language-selector:hover .lang-dropdown {
            display: block;
        }

        .lang-dropdown a {
            display: block;
            padding: 10px 20px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .lang-dropdown a:hover {
            background: rgba(255, 77, 109, 0.3);
            color: #fff;
        }

        .donate-btn {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 22px;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .donate-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: #ff4d6d;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-section {
            margin-bottom: 30px;
        }

        .project-name {
            font-size: 140px;
            font-weight: 900;
            line-height: 0.85;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: -4px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.5);
        }

        .online-section {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 40px;
        }

        .online-label {
            font-size: 18px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .online-number {
            font-size: 72px;
            font-weight: 700;
            color: #ff4d6d;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.8), 2px 2px 4px rgba(0,0,0,0.5);
            line-height: 1;
        }

        .season-pass {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 28px;
            display: inline-block;
            margin-bottom: 50px;
            border-radius: 40px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #fff;
            transition: all 0.3s;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .season-pass:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: #ff4d6d;
        }

        .season-pass span {
            color: #ff4d6d;
            margin-left: 10px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 25px;
            margin-bottom: 80px;
        }

        .btn-download {
            background: #ff4d6d;
            color: #fff;
            text-decoration: none;
            padding: 18px 60px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 40px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.4);
        }

        .btn-download:hover {
            background: #e63e5e;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 77, 109, 0.6);
        }

        .btn-forum {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            text-decoration: none;
            padding: 18px 60px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .btn-forum:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: #ff4d6d;
        }

        /* Футер */
        .footer {
            margin-top: auto;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            color: #fff;
            line-height: 1.6;
            max-width: 700px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .footer a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.5);
            margin-right: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #ff4d6d;
            border-bottom-color: #ff4d6d;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #ff4d6d;
            padding: 50px;
            max-width: 600px;
            width: 90%;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #ff4d6d;
            margin-bottom: 25px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-content p, .modal-content ul {
            color: #fff;
            margin-bottom: 30px;
            line-height: 1.8;
            font-size: 15px;
        }

        .modal-content ul {
            padding-left: 20px;
        }

        .modal-content li {
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-close {
            background: #ff4d6d;
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 40px;
            width: 100%;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #e63e5e;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        /* Адаптация */
        @media (max-width: 1024px) {
            .container {
                padding: 20px 30px;
            }
            
            .project-name {
                font-size: 100px;
            }
            
            .navbar {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
            
            .nav-links {
                flex-wrap: wrap;
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .project-name {
                font-size: 60px;
            }
            
            .online-number {
                font-size: 48px;
            }
            
            .online-label {
                font-size: 14px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn-download, .btn-forum {
                text-align: center;
                padding: 15px 30px;
            }
            
            .footer a {
                display: inline-block;
                margin-bottom: 10px;
            }
        }

        /* Анимации */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .project-name, .online-section, .season-pass, .action-buttons {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .online-section { animation-delay: 0.2s; }
        .season-pass { animation-delay: 0.3s; }
        .action-buttons { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Навигация -->
        <div class="navbar">
            <div class="logo">GRANDIS RP</div>
            <div class="nav-links">
                <a onclick="showPage('download')">DOWNLOAD</a>
                <a onclick="showPage('forum')">FORUM</a>
                <a onclick="showPage('about')">ABOUT</a>
                <a onclick="showPage('wiki')">WIKI</a>
            </div>
            <div class="nav-right">
                <!-- Переключатель языков -->
                <div class="language-selector">
                    <div class="lang-btn">
                        <span id="currentLang">EN</span>
                        <span>▼</span>
                    </div>
                    <div class="lang-dropdown">
                        <a href="#" onclick="switchLanguage('en'); return false;">ENGLISH</a>
                        <a href="#" onclick="switchLanguage('ru'); return false;">РУССКИЙ</a>
                        <a href="#" onclick="switchLanguage('pl'); return false;">POLSKI</a>
                    </div>
                </div>
                <a href="#" class="donate-btn" onclick="showPage('donate'); return false;">DONATE</a>
            </div>
        </div>

        <!-- Основной контент -->
        <div class="main-content">
            <div class="title-section">
                <div class="project-name" id="projectName">GRANDIS</div>
            </div>

            <!-- Онлайн -->
            <div class="online-section">
                <span class="online-label" id="playersLabel">PLAYERS:</span>
                <span class="online-number" id="onlineCount">1932</span>
            </div>

            <!-- Seasonal Pass -->
            <div class="season-pass" onclick="showPage('season')">
                <span id="seasonPassText">SEASON PASS</span> <span>→</span>
            </div>

            <!-- Кнопки -->
            <div class="action-buttons">
                <button class="btn-download" onclick="downloadLauncher()" id="downloadBtn">DOWNLOAD NOW</button>
                <button class="btn-forum" onclick="showPage('forum')" id="forumBtn">FORUM</button>
            </div>

            <!-- Футер -->
            <div class="footer" id="footerText">
                Grandis RP is not affiliated with or endorsed by Take-Two, Rockstar North Interactive or any other copyright holder.
                <br><br>
                <a href="#" onclick="showPage('disclaimer'); return false;">DISCLAIMER</a>
                <a href="#" onclick="showPage('about'); return false;">ABOUT</a>
                <a href="#" onclick="showPage('privacy'); return false;">PRIVACY</a>
                <a href="#" onclick="showPage('contact'); return false;">CONTACT</a>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="contentModal">
        <div class="modal-content">
            <h2 id="modalTitle">Заголовок</h2>
            <div id="modalBody">
                <p>Содержимое</p>
            </div>
            <button class="modal-close" onclick="closeModal()" id="closeBtn">CLOSE</button>
        </div>
    </div>

    <script>
        // Конфигурация
        const SERVER_CONFIG = {
            ip: '123.45.67.89:30120',  // Замени на свой IP
            name: 'Grandis RP'
        };

        // Языковые настройки
        const translations = {
            en: {
                projectName: 'GRANDIS',
                players: 'PLAYERS:',
                seasonPass: 'SEASON PASS',
                downloadBtn: 'DOWNLOAD NOW',
                forumBtn: 'FORUM',
                closeBtn: 'CLOSE',
                footer: 'Grandis RP is not affiliated with or endorsed by Take-Two, Rockstar North Interactive or any other copyright holder.',
                footerLinks: ['DISCLAIMER', 'ABOUT', 'PRIVACY', 'CONTACT'],
                modal: {
                    about: { title: 'ABOUT GRANDIS RP', content: 'Grandis RP is a hardcore role-play project on GTA 5. We offer unique mechanics, stable economy and friendly community. Server opened in 2024.' },
                    disclaimer: { title: 'DISCLAIMER', content: 'Grandis RP is not affiliated with or endorsed by Take-Two Interactive, Rockstar North Interactive or any of their subsidiaries. All game content and materials used are properties of their respective owners.' },
                    forum: { title: 'FORUM', content: 'Our forum is currently under construction. Please join our Discord for communication.' },
                    wiki: { title: 'WIKI', content: 'Game guide and documentation will be available soon.' },
                    donate: { title: 'DONATE', content: 'Support the project development. Donations will be used for server maintenance and development of new features.' },
                    season: { title: 'SEASON PASS', content: 'Season Pass system is in development. Stay tuned!' },
                    privacy: { title: 'PRIVACY POLICY', content: 'We respect your privacy. No personal data is collected without your consent.' },
                    contact: { title: 'CONTACT US', content: 'Discord: discord.gg/grandisrp\nEmail: support@grandisrp.com' },
                    download: { title: 'DOWNLOAD', content: 'Launcher will be available soon. For now, you can connect via IP: ' + SERVER_CONFIG.ip }
                }
            },
            ru: {
                projectName: 'ГРАНДИС',
                players: 'ИГРОКОВ:',
                seasonPass: 'СЕЗОННЫЙ ПРОПУСК',
                downloadBtn: 'СКАЧАТЬ',
                forumBtn: 'ФОРУМ',
                closeBtn: 'ЗАКРЫТЬ',
                footer: 'Grandis RP не аффилирован с Take-Two, Rockstar North Interactive или другими правообладателями.',
                footerLinks: ['ДИСКЛЕЙМЕР', 'О ПРОЕКТЕ', 'КОНФИДЕНЦИАЛЬНОСТЬ', 'КОНТАКТЫ'],
                modal: {
                    about: { title: 'О ПРОЕКТЕ GRANDIS RP', content: 'Grandis RP — это хардкорный ролевой проект на GTA 5. Мы предлагаем уникальные механики, стабильную экономику и дружное сообщество. Сервер открыт в 2024 году.' },
                    disclaimer: { title: 'ДИСКЛЕЙМЕР', content: 'Grandis RP не связан с Take-Two Interactive, Rockstar North Interactive или их дочерними компаниями. Все игровые материалы принадлежат их законным владельцам.' },
                    forum: { title: 'ФОРУМ', content: 'Наш форум находится в разработке. Для общения присоединяйтесь к нашему Discord.' },
                    wiki: { title: 'ВИКИ', content: 'Руководство по игре и документация появятся позже.' },
                    donate: { title: 'ДОНАТ', content: 'Поддержите развитие проекта. Донаты пойдут на содержание сервера и разработку новых функций.' },
                    season: { title: 'СЕЗОННЫЙ ПРОПУСК', content: 'Система сезонных пропусков в разработке. Следите за новостями!' },
                    privacy: { title: 'КОНФИДЕНЦИАЛЬНОСТЬ', content: 'Мы уважаем вашу конфиденциальность. Личные данные не собираются без вашего согласия.' },
                    contact: { title: 'КОНТАКТЫ', content: 'Discord: discord.gg/grandisrp\nEmail: support@grandisrp.com' },
                    download: { title: 'СКАЧАТЬ', content: 'Лаунчер будет доступен позже. Пока вы можете подключиться по IP: ' + SERVER_CONFIG.ip }
                }
            },
            pl: {
                projectName: 'GRANDIS',
                players: 'GRACZY:',
                seasonPass: 'PRZEPUSTKA SEZONOWA',
                downloadBtn: 'POBIERZ',
                forumBtn: 'FORUM',
                closeBtn: 'ZAMKNIJ',
                footer: 'Grandis RP nie jest powiązany z Take-Two, Rockstar North Interactive ani innymi właścicielami praw autorskich.',
                footerLinks: ['ZASTRZEŻENIA', 'O PROJEKCIE', 'PRYWATNOŚĆ', 'KONTAKT'],
                modal: {
                    about: { title: 'O GRANDIS RP', content: 'Grandis RP to hardkorowy projekt role-play w GTA 5. Oferujemy unikalne mechaniki, stabilną ekonomię i przyjazną społeczność. Serwer otwarty w 2024.' },
                    disclaimer: { title: 'ZASTRZEŻENIA PRAWNE', content: 'Grandis RP nie jest powiązany z Take-Two Interactive, Rockstar North Interactive ani ich spółkami zależnymi. Wszystkie materiały z gry należą do ich prawnych właścicieli.' },
                    forum: { title: 'FORUM', content: 'Nasze forum jest w budowie. Dołącz do naszego Discorda aby porozmawiać.' },
                    wiki: { title: 'WIKI', content: 'Przewodnik po grze i dokumentacja wkrótce.' },
                    donate: { title: 'WSPARCIE', content: 'Wesprzyj rozwój projektu. Środki zostaną przeznaczone na utrzymanie serwera i nowe funkcje.' },
                    season: { title: 'PRZEPUSTKA SEZONOWA', content: 'System przepustek sezonowych w rozwoju. Bądź na bieżąco!' },
                    privacy: { title: 'POLITYKA PRYWATNOŚCI', content: 'Szanujemy Twoją prywatność. Dane osobowe nie są zbierane bez Twojej zgody.' },
                    contact: { title: 'KONTAKT', content: 'Discord: discord.gg/grandisrp\nEmail: support@grandisrp.com' },
                    download: { title: 'POBIERZ', content: 'Launcher będzie dostępny wkrótce. Na razie możesz połączyć się przez IP: ' + SERVER_CONFIG.ip }
                }
            }
        };

        // Текущий язык
        let currentLanguage = 'en';

        // Переключение языка
        function switchLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('currentLang').textContent = lang.toUpperCase();
            updateContent();
        }

        // Обновление контента
        function updateContent() {
            const t = translations[currentLanguage];
            
            document.getElementById('projectName').textContent = t.projectName;
            document.getElementById('playersLabel').textContent = t.players;
            document.getElementById('seasonPassText').textContent = t.seasonPass;
            document.getElementById('downloadBtn').textContent = t.downloadBtn;
            document.getElementById('forumBtn').textContent = t.forumBtn;
            document.getElementById('closeBtn').textContent = t.closeBtn;
            
            // Обновляем футер
            const footerLinks = document.querySelectorAll('.footer a');
            t.footerLinks.forEach((text, index) => {
                if (footerLinks[index]) {
                    footerLinks[index].textContent = text;
                }
            });
        }

        // Показать страницу
        function showPage(page) {
            const t = translations[currentLanguage].modal;
            const modal = document.getElementById('contentModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            if (t[page]) {
                title.textContent = t[page].title;
                body.innerHTML = `<p>${t[page].content.replace(/\n/g, '<br>')}</p>`;
            } else {
                title.textContent = page.toUpperCase();
                body.innerHTML = '<p>Content coming soon...</p>';
            }
            
            modal.classList.add('show');
        }

        // Закрыть модальное окно
        function closeModal() {
            document.getElementById('contentModal').classList.remove('show');
        }

        // Закрыть по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Закрыть по клику на фон
        window.onclick = function(event) {
            const modal = document.getElementById('contentModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Функция скачивания
        function downloadLauncher() {
            showPage('download');
        }

        // Симуляция онлайн
        function updateOnline() {
            const randomOnline = Math.floor(Math.random() * (2500 - 1500 + 1)) + 1500;
            document.getElementById('onlineCount').textContent = randomOnline;
        }

        // Обновляем онлайн каждые 30 секунд
        setInterval(updateOnline, 30000);
        updateOnline();
    </script>
</body>
</html>
